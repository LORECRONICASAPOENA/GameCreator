<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#101c2b">
  <title>Apoena Game Creator — Editor de Mapas</title>
  <style>html,body,#editor{margin:0;min-height:100%;width:100%;}body{background:#0b1725;color:#eef8fc;font:14px system-ui,Arial,sans-serif}#editor{min-height:100vh}</style>
</head>
<body>
  <div id="editor"></div>
  <script src="terrain-system.js"></script>
  <script src="modulo-integrado.js"></script>
  <script>
    if (window.ApoenaMapaIntegrado) {
      window.ApoenaMapaIntegrado.mount(document.getElementById('editor'));
    } else {
      document.getElementById('editor').textContent = 'Não foi possível carregar o Editor de Mapas. Confira se os dois arquivos JavaScript estão na mesma pasta.';
    }
  </script>
</body>
</html>
