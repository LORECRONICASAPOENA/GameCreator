name: Game Creator - integração de catálogo (manual)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  testar-catalogo:
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 10
    defaults:
      run:
        shell: powershell -NoProfile -ExecutionPolicy Bypass -Command ". '{0}'"
    steps:
      - name: Baixar código
        uses: actions/checkout@v4
      - name: Preparar Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Executar suíte canônica de integração
        run: |
          node integracao/testes/catalogo.test.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node integracao/testes/terrain-system.test.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node integracao/testes/world-object-system.test.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node integracao/testes/natureza.test.cjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
