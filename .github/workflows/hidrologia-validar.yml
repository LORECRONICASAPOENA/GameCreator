name: Validar Hidrologia Apoena (Windows hospedado)
on:
  push:
    branches: ['feature/hidrologia-erosao-niveis-20261029']
    paths:
      - 'map-editor/hidrologia-core.js'
      - 'tests/hidrologia.test.cjs'
      - '.github/workflows/hidrologia-validar.yml'
  pull_request:
    branches: [main]
    paths:
      - 'map-editor/hidrologia-core.js'
      - 'tests/hidrologia.test.cjs'
      - '.github/workflows/hidrologia-validar.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: apoena-creator-hidrologia-\${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  testar-hidrologia:
    runs-on: windows-latest
    timeout-minutes: 12
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
        with:
          clean: true
          persist-credentials: false
      - name: Preparar Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Verificar sintaxe
        run: |
          node --check map-editor/hidrologia-core.js
          node --check tests/hidrologia.test.cjs
      - name: Testar chuva, bacias, erosão e persistência
        run: node tests/hidrologia.test.cjs
