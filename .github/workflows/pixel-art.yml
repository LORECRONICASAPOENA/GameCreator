name: Validar Apoena Creator Pixel Art
on:
  push:
    branches: [feature/estudio-unificado-pixelart-v41]
  pull_request:
    branches: [main]
    paths:
      - "index.html"
      - "bundle-v4/**"
      - "ABRIR_GAME_CREATOR.cmd"
      - "APOENA_GAME_CREATOR_V4_0_BANCADA_INTEGRADA.html"
      - "pixel-art/**"
      - "shared/**"
      - "biblioteca/**"
      - "map-editor/**"
      - "integracao/**"
      - "legacy/**"
      - "**/*.gd"
      - "tests/**"
      - "package.json"
      - "README.md"
      - "ORGANIZACAO_EDITOR.md"
      - ".github/workflows/pixel-art.yml"
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:
permissions:
  contents: read

concurrency:
  group: apoena-v41-${{ github.event.pull_request.head.ref || github.ref }}
  cancel-in-progress: true

jobs:
  validar:
    runs-on: [self-hosted, Windows, X64]
    defaults:
      run:
        shell: powershell -NoProfile -ExecutionPolicy Bypass -Command ". '{0}'"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Preparar diagnosticos do runner Windows
        run: |
          $ErrorActionPreference = "Stop"
          $diagDir = Join-Path $env:GITHUB_WORKSPACE ".ci-results"
          New-Item -ItemType Directory -Force -Path $diagDir | Out-Null
          $log = Join-Path $diagDir "runner.log"
          "Runner OS: $env:RUNNER_OS" | Out-File -FilePath $log -Encoding utf8
          "Runner name: $env:RUNNER_NAME" | Out-File -FilePath $log -Append -Encoding utf8
          $nodeOutput = & node --version 2>&1
          $nodeCode = $LASTEXITCODE
          $nodeOutput | Out-File -FilePath $log -Append -Encoding utf8
          if ($nodeCode -ne 0) { throw "node --version falhou com codigo $nodeCode." }
          $npmOutput = & npm --version 2>&1
          $npmCode = $LASTEXITCODE
          $npmOutput | Out-File -FilePath $log -Append -Encoding utf8
          if ($npmCode -ne 0) { throw "npm --version falhou com codigo $npmCode." }
      - name: Smoke test do loader no navegador headless quando disponivel
        run: |
          $ErrorActionPreference = "Stop"
          $diagDir = Join-Path $env:GITHUB_WORKSPACE ".ci-results"
          $candidates = @(
            (Join-Path $env:ProgramFiles "Microsoft/Edge/Application/msedge.exe"),
            (Join-Path ${env:ProgramFiles(x86)} "Microsoft/Edge/Application/msedge.exe"),
            (Join-Path $env:ProgramFiles "Google/Chrome/Application/chrome.exe"),
            (Join-Path ${env:ProgramFiles(x86)} "Google/Chrome/Application/chrome.exe")
          )
          $browser = $candidates | Where-Object { $_ -and (Test-Path -LiteralPath $_) } | Select-Object -First 1
          if (-not $browser) {
            "BROWSER_RUNTIME_NOT_INSTALLED: smoke test headless nao executado." | Set-Content -Encoding UTF8 (Join-Path $diagDir "browser-loader.log")
            Write-Warning "Edge/Chrome nao encontrado; a verificacao de navegador fica registrada como nao testada."
            return
          }
          $entryPath = Join-Path $env:GITHUB_WORKSPACE "index.html"
          $entryUri = ([System.Uri]$entryPath).AbsoluteUri
          $domPath = Join-Path $diagDir "browser-loader-dom.html"
          $logPath = Join-Path $diagDir "browser-loader.log"
          $profile = Join-Path $env:RUNNER_TEMP ("apoena-browser-" + $env:GITHUB_RUN_ID)
          if (Test-Path -LiteralPath $profile) { Remove-Item -LiteralPath $profile -Recurse -Force }
          $arguments = '--headless --disable-gpu --no-first-run --no-default-browser-check --disable-extensions --allow-file-access-from-files --virtual-time-budget=10000 --user-data-dir="' + $profile + '" --dump-dom "' + $entryUri + '"'
          $process = Start-Process -FilePath $browser -ArgumentList $arguments -RedirectStandardOutput $domPath -RedirectStandardError $logPath -Wait -PassThru
          "Browser: $browser | ExitCode: $($process.ExitCode) | Entry: $entryUri" | Add-Content -Encoding UTF8 -Path $logPath
          if ($process.ExitCode -ne 0) { throw "Navegador headless encerrou com codigo $($process.ExitCode). Consulte .ci-results/browser-loader.log." }
          if (-not (Test-Path -LiteralPath $domPath) -or (Get-Item -LiteralPath $domPath).Length -lt 1000) {
            throw "Navegador headless nao produziu DOM suficiente. Consulte .ci-results/browser-loader.log."
          }
          $dom = Get-Content -Raw $domPath
          foreach ($required in @('id="page-pixelart"', 'Game Creator v4.0', 'shared/asset-library.js', 'shared/creator-bridge.js', 'pixel-art/natureza.js')) {
            if (-not $dom.Contains($required)) { throw "Smoke test do loader falhou; DOM sem: $required" }
          }
          if ($dom.Contains("Nao foi possivel abrir a versao unificada")) { throw "O loader exibiu tela de erro." }
          "BROWSER_LOADER_SMOKE_OK" | Add-Content -Encoding UTF8 -Path $logPath
      - name: Preservar loader e compilar Creator nativo V4.0
        run: |
          $ErrorActionPreference = "Stop"
          $diagDir = Join-Path $env:GITHUB_WORKSPACE ".ci-results"
          New-Item -ItemType Directory -Force -Path $diagDir | Out-Null
          Copy-Item -LiteralPath (Join-Path $env:GITHUB_WORKSPACE "index.html") -Destination (Join-Path $diagDir "index-loader.html") -Force
          $tokens = $null
          $parseErrors = $null
          [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path "integracao/build_unificado.ps1"), [ref]$tokens, [ref]$parseErrors) | Out-Null
          if ($parseErrors.Count -gt 0) { throw ("Sintaxe PowerShell inválida: " + (($parseErrors | ForEach-Object { $_.Message }) -join "; ")) }
          & (Join-Path $env:GITHUB_WORKSPACE "integracao/build_unificado.ps1") 2>&1 | Tee-Object -FilePath (Join-Path $diagDir "build.log")
          $built = Get-Content -Raw (Join-Path $env:GITHUB_WORKSPACE "index.html")
          foreach ($required in @('id="page-pixelart"', 'shared/asset-library.js', 'shared/creator-bridge.js', 'pixel-art/natureza.js', 'pixel-art/modulo-integrado.js', 'pixel-art/ponte-creator.js')) {
            if (-not $built.Contains($required)) { throw "Build nativo incompleto: $required" }
          }
          if ($built.Contains("<iframe")) { throw "A entrada nativa nao pode substituir o Creator por iframe." }
          $hash = Get-FileHash -LiteralPath (Join-Path $env:GITHUB_WORKSPACE "index.html") -Algorithm SHA256
          "Build nativo OK; bytes=$((Get-Item index.html).Length); SHA256=$($hash.Hash)" | Tee-Object -FilePath (Join-Path $diagDir "build.log") -Append
      - name: Verificar sintaxe do build Python quando disponivel
        run: |
          $ErrorActionPreference = "Stop"
          $diagDir = Join-Path $env:GITHUB_WORKSPACE ".ci-results"
          $logPath = Join-Path $diagDir "python-build.log"
          $python = Get-Command python.exe -ErrorAction SilentlyContinue
          if (-not $python -or $python.Source -match '\\Microsoft\\WindowsApps\\python(?:3)?\.exe$') {
            "PYTHON_NOT_INSTALLED: build_unificado.py nao foi compilado neste runner." | Set-Content -Encoding UTF8 $logPath
            Write-Warning "Python nao instalado (ou somente alias da Microsoft Store); teste opcional ignorado. Build principal PowerShell continua validado."
            return
          }
          $pythonPath = $python.Source
          $oldPreference = $ErrorActionPreference
          $ErrorActionPreference = "Continue"
          $versionOutput = & $pythonPath --version 2>&1
          $versionExitCode = $LASTEXITCODE
          $ErrorActionPreference = $oldPreference
          $versionOutput | Set-Content -Encoding UTF8 $logPath
          if ($versionExitCode -ne 0) {
            "PYTHON_NOT_EXECUTABLE: verificacao de sintaxe Python nao executada." | Add-Content -Encoding UTF8 $logPath
            Write-Warning "Python nao executavel; teste opcional ignorado. Build principal PowerShell continua validado."
            return
          }
          $pythonCode = 'import ast, pathlib; ast.parse(pathlib.Path("integracao/build_unificado.py").read_text(encoding="utf-8")); print("Python build syntax OK")'
          $ErrorActionPreference = "Continue"
          $syntaxOutput = & $pythonPath -c $pythonCode 2>&1
          $syntaxExitCode = $LASTEXITCODE
          $ErrorActionPreference = $oldPreference
          $syntaxOutput | Add-Content -Encoding UTF8 $logPath
          if ($syntaxExitCode -ne 0) { throw "Sintaxe do build Python invalida. Consulte .ci-results/python-build.log." }
      - name: Instalar dependencias de teste
        run: |
          npm install --no-package-lock --ignore-scripts --no-audit --no-fund 2>&1 | Tee-Object -FilePath .ci-results/install.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Validar sintaxe JavaScript
        run: |
          node --check pixel-art/estudio.js 2>&1 | Tee-Object -FilePath .ci-results/syntax.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --check pixel-art/corte-inteligente.js 2>&1 | Tee-Object -FilePath .ci-results/syntax.log -Append
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --check shared/asset-library.js 2>&1 | Tee-Object -FilePath .ci-results/syntax.log -Append
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --check shared/tileset-check.js 2>&1 | Tee-Object -FilePath .ci-results/syntax.log -Append
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --check shared/library-backup.js 2>&1 | Tee-Object -FilePath .ci-results/syntax.log -Append
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --check shared/creator-bridge.js 2>&1 | Tee-Object -FilePath .ci-results/syntax.log -Append
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --check pixel-art/ponte-creator.js 2>&1 | Tee-Object -FilePath .ci-results/syntax.log -Append
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --check pixel-art/modulo-integrado.js 2>&1 | Tee-Object -FilePath .ci-results/syntax.log -Append
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --check pixel-art/natureza.js 2>&1 | Tee-Object -FilePath .ci-results/syntax.log -Append
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --check map-editor/modulo-integrado.js 2>&1 | Tee-Object -FilePath .ci-results/syntax.log -Append
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --check integracao/catalogo.js 2>&1 | Tee-Object -FilePath .ci-results/syntax.log -Append
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Testar Corte Inteligente e contratos da interface
        run: |
          node tests/corte-inteligente.test.cjs 2>&1 | Tee-Object -FilePath .ci-results/corte.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Testar verificador de encaixe dos tilesets
        run: |
          node tests/tileset-check.test.cjs 2>&1 | Tee-Object -FilePath .ci-results/tileset.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Testar biblioteca e persistencia IndexedDB
        run: |
          node tests/asset-library.test.cjs 2>&1 | Tee-Object -FilePath .ci-results/library.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Testar backup e restauracao da biblioteca
        run: |
          cmd /c "node tests/library-backup.test.cjs > .ci-results\library-backup.log 2>&1"
          $testCode = $LASTEXITCODE
          Get-Content .ci-results/library-backup.log
          if ($testCode -ne 0) { exit $testCode }
      - name: Testar exportacao de catalogo e contrato Godot
        run: |
          node tests/catalogo.test.cjs 2>&1 | Tee-Object -FilePath .ci-results/catalogo.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Testar protocolo de sincronizacao entre V4.0 e V4.1
        run: |
          node tests/creator-bridge.test.cjs 2>&1 | Tee-Object -FilePath .ci-results/creator-bridge.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Testar runtime Godot 4 quando instalado
        run: |
          $ErrorActionPreference = "Stop"
          $diagDir = Join-Path $env:GITHUB_WORKSPACE ".ci-results"
          $godot = Get-Command godot -ErrorAction SilentlyContinue
          if (-not $godot) { $godot = Get-Command godot4 -ErrorAction SilentlyContinue }
          if (-not $godot) {
            "GODOT_RUNTIME_NOT_INSTALLED: teste GDScript nao executado neste runner." | Set-Content -Encoding UTF8 (Join-Path $diagDir "godot-runtime.log")
            Write-Warning "Godot 4 nao encontrado. O contrato esta coberto pelo teste Node; o runtime GDScript fica registrado como nao testado."
            return
          }
          $version = & $godot.Source --version 2>&1
          $versionCode = $LASTEXITCODE
          $versionText = ($version | Out-String).Trim()
          $versionText | Set-Content -Encoding UTF8 (Join-Path $diagDir "godot-runtime.log")
          if ($versionCode -ne 0) { throw "Nao foi possivel consultar a versao do Godot." }
          if ($versionText -notmatch '^4\.') { throw "Godot 4 necessario; encontrado: $versionText" }
          & $godot.Source --headless --path (Join-Path $env:GITHUB_WORKSPACE "integracao/godot") --script res://tests/test_catalogo.gd 2>&1 | Tee-Object -FilePath (Join-Path $diagDir "godot-runtime.log") -Append
          $godotCode = $LASTEXITCODE
          if ($godotCode -ne 0) { throw "Teste Godot falhou com codigo $godotCode." }
      - name: Garantir preservacao do Creator original e dos modulos
        run: |
          $required = @(
            "APOENA_GAME_CREATOR_V4_0_BANCADA_INTEGRADA.html",
            "pixel-art/index.html",
            "pixel-art/estudio.html",
            "map-editor/index.html",
            "integracao/index.html",
            "legacy/iniciador-anterior.html"
          )
          foreach ($path in $required) {
            if (-not (Test-Path $path)) { throw "Arquivo essencial ausente: $path" }
          }
          $index = Get-Content -Raw index.html
          if (-not $index.Contains('id="page-pixelart"') -or -not $index.Contains('data-page="pixelart"')) {
            throw "A aba nativa Pixel Art nao foi adicionada pelo build."
          }
          # Cada step do Actions tem um processo PowerShell separado; rele a fonte original.
          $originalPath = "APOENA_GAME_CREATOR_V4_0_BANCADA_INTEGRADA.html"
          $original = Get-Content -Raw $originalPath
          if (-not $original.Contains("</main>")) { throw "Fonte V4.0 incompleta durante a verificacao de navegacao." }
          # Confere todos os valores de navegacao que existiam na fonte V4.0.
          # Isso protege a bancada original sem presumir nomes de abas inexistentes.
          $originalPages = @([regex]::Matches($original, 'data-page="([^"]+)"') | ForEach-Object { $_.Groups[1].Value } | Sort-Object -Unique)
          if ($originalPages.Count -lt 1) { throw "Nenhuma aba original foi encontrada na fonte V4.0." }
          foreach ($pageName in $originalPages) {
            $marker = 'data-page="' + $pageName + '"'
            if (-not $index.Contains($marker)) { throw "A navegacao original foi perdida: $pageName" }
          }
          $map = Get-Content -Raw map-editor/index.html
          if ($map -notmatch 'asset-library.js') { throw "O editor de mapas nao carrega a biblioteca central." }
          "Contratos de preservacao e integracao passaram." | Tee-Object -FilePath .ci-results/contracts.log
      - name: Preparar entrega na pasta ChatGPT trabalho do runner
        if: always()
        run: |
          $ErrorActionPreference = "Stop"
          $source = $env:GITHUB_WORKSPACE
          if (-not $source -or -not (Test-Path -LiteralPath $source)) { throw "GITHUB_WORKSPACE invalido: $source" }
          $stage = Join-Path $source "_delivery"
          $project = Join-Path $stage "GameCreator-V4.1"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          $deliveryRoot = $null
          $starts = @($env:RUNNER_WORKSPACE, $env:RUNNER_TEMP, $source) | Where-Object { $_ }
          foreach ($startPath in $starts) {
            $probe = $startPath
            for ($i = 0; $i -lt 10 -and $probe; $i++) {
              if ((Test-Path -LiteralPath (Join-Path $probe "run.cmd")) -or (Test-Path -LiteralPath (Join-Path $probe "config.cmd"))) {
                $deliveryRoot = Join-Path $probe "ChatGPT trabalho"
                break
              }
              $parent = Split-Path -Parent $probe
              if (-not $parent -or $parent -eq $probe) { break }
              $probe = $parent
            }
            if ($deliveryRoot) { break }
          }
          if (-not $deliveryRoot) {
            Write-Warning "Nao localizei run.cmd/config.cmd nos diretorios ancestrais. A copia local sera guardada em RUNNER_TEMP."
            $deliveryRoot = Join-Path $env:RUNNER_TEMP "ChatGPT trabalho"
          }
          New-Item -ItemType Directory -Force -Path $deliveryRoot | Out-Null
          try {
            if (Test-Path -LiteralPath $project) { Remove-Item -LiteralPath $project -Recurse -Force }
            New-Item -ItemType Directory -Force -Path $project | Out-Null
            $skipNames = @(".git", "node_modules", ".ci-results", "_delivery", ".godot", "__pycache__")
            $items = Get-ChildItem -LiteralPath $source -Force | Where-Object { $_.Name -notin $skipNames }
            foreach ($item in $items) {
              Copy-Item -LiteralPath $item.FullName -Destination $project -Recurse -Force
            }
            $info = @(
              "APOENA GAME CREATOR V4.1 - PACOTE DE TRABALHO",
              "Commit: $env:GITHUB_SHA",
              "Run: https://github.com/apoenalore/GameCreator/actions/runs/$env:GITHUB_RUN_ID",
              "Pull request: https://github.com/apoenalore/GameCreator/pull/1",
              "Criado em: $(Get-Date -Format 'yyyy-MM-dd HH:mm:ss K')",
              "",
              "Esta pasta contem a copia do checkout deste commit.",
              "O pacote nao significa que os testes passaram. Confira o resultado do run acima.",
              "A V4.0 original foi mantida no repositorio; nao houve mesclagem automatica na main."
            )
            $info | Set-Content -Encoding UTF8 (Join-Path $project "ENTREGA-INFO.txt")
            $manifestPath = Join-Path $project "MANIFESTO-ARQUIVOS.txt"
            $files = @(Get-ChildItem -LiteralPath $project -File -Recurse -Force | Sort-Object FullName)
            $lines = foreach ($file in $files) {
              $relative = $file.FullName.Substring($project.Length).TrimStart([char[]]@([char]92,[char]47))
              "{0}{1}{2} bytes" -f $relative, [char]9, $file.Length
            }
            @("Commit: $env:GITHUB_SHA", "Arquivos: $($files.Count)", "", $lines) | Set-Content -Encoding UTF8 $manifestPath
            $zipPath = Join-Path $stage "Apoena-GameCreator-V4.1.zip"
            if (Test-Path -LiteralPath $zipPath) { Remove-Item -LiteralPath $zipPath -Force }
            Add-Type -AssemblyName System.IO.Compression.FileSystem
            [System.IO.Compression.ZipFile]::CreateFromDirectory($project, $zipPath, [System.IO.Compression.CompressionLevel]::Optimal, $true)
            $latest = @(
              "ENTREGA MAIS RECENTE - APOENA GAME CREATOR V4.1",
              "Commit: $env:GITHUB_SHA",
              "Run: https://github.com/apoenalore/GameCreator/actions/runs/$env:GITHUB_RUN_ID",
              "Pasta: GameCreator-V4.1",
              "Arquivo ZIP: Apoena-GameCreator-V4.1.zip",
              "Manifesto: GameCreator-V4.1\MANIFESTO-ARQUIVOS.txt",
              "Criado em: $(Get-Date -Format 'yyyy-MM-dd HH:mm:ss K')"
            )
            $latest | Set-Content -Encoding UTF8 (Join-Path $stage "LEIA-ME-ENTREGA.txt")
            $existingProject = Join-Path $deliveryRoot "GameCreator-V4.1"
            if (Test-Path -LiteralPath $existingProject) { Remove-Item -LiteralPath $existingProject -Recurse -Force }
            Copy-Item -LiteralPath $project -Destination $existingProject -Recurse -Force
            Copy-Item -LiteralPath $zipPath -Destination (Join-Path $deliveryRoot "Apoena-GameCreator-V4.1.zip") -Force
            Copy-Item -LiteralPath (Join-Path $stage "LEIA-ME-ENTREGA.txt") -Destination (Join-Path $deliveryRoot "LEIA-ME-ENTREGA.txt") -Force
            Write-Output "Entrega preparada em: $deliveryRoot"
            Write-Output "Arquivos no projeto (antes do manifesto): $($files.Count)"
            Write-Output "ZIP: $(Join-Path $deliveryRoot 'Apoena-GameCreator-V4.1.zip')"
          } catch {
            $errorText = "Falha ao preparar entrega: $($_.Exception.Message)"
            $errorText | Set-Content -Encoding UTF8 (Join-Path $stage "ERRO-ENTREGA.txt")
            Write-Error $errorText
          }
      - name: Disponibilizar pacote de codigo para download
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Apoena-GameCreator-V4.1-source
          path: _delivery/
          if-no-files-found: warn
      - name: Anexar logs de diagnostico
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v41-ci-diagnostics
          path: .ci-results/
          include-hidden-files: true
          if-no-files-found: warn
