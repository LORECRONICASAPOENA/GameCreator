name: Validar Apoena Creator Pixel Art
on:
  push:
    branches: [feature/estudio-unificado-pixelart-v41]
  pull_request:
    branches: [main]
    paths:
      - "index.html"
      - "APOENA_GAME_CREATOR_V4_0_BANCADA_INTEGRADA.html"
      - "pixel-art/**"
      - "shared/**"
      - "biblioteca/**"
      - "map-editor/**"
      - "integracao/**"
      - "tests/**"
      - "package.json"
      - "README.md"
      - "ORGANIZACAO_EDITOR.md"
      - ".github/workflows/pixel-art.yml"
  workflow_dispatch:
permissions:
  contents: read
  actions: write
jobs:
  validar:
    runs-on: [self-hosted, Windows, X64]
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Preparar diagnósticos do runner Windows
        run: |
          New-Item -ItemType Directory -Force -Path .ci-results | Out-Null
          "Runner OS: $env:RUNNER_OS" | Tee-Object -FilePath .ci-results/runner.log
          "Runner name: $env:RUNNER_NAME" | Tee-Object -FilePath .ci-results/runner.log -Append
          node --version 2>&1 | Tee-Object -FilePath .ci-results/runner.log -Append
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm --version 2>&1 | Tee-Object -FilePath .ci-results/runner.log -Append
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Instalar dependências de teste
        run: |
          npm install --no-package-lock --ignore-scripts --no-audit --no-fund 2>&1 | Tee-Object -FilePath .ci-results/install.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Validar sintaxe JavaScript
        run: |
          node --check pixel-art/estudio.js 2>&1 | Tee-Object -FilePath .ci-results/syntax.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --check pixel-art/corte-inteligente.js 2>&1 | Tee-Object -FilePath .ci-results/syntax.log -Append
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --check shared/asset-library.js 2>&1 | Tee-Object -FilePath .ci-results/syntax.log -Append
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --check shared/tileset-check.js 2>&1 | Tee-Object -FilePath .ci-results/syntax.log -Append
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --check shared/library-backup.js 2>&1 | Tee-Object -FilePath .ci-results/syntax.log -Append
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Testar Corte Inteligente e contratos da interface
        run: |
          node tests/corte-inteligente.test.cjs 2>&1 | Tee-Object -FilePath .ci-results/corte.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Testar verificador de encaixe dos tilesets
        run: |
          node tests/tileset-check.test.cjs 2>&1 | Tee-Object -FilePath .ci-results/tileset.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Testar biblioteca e persistência IndexedDB
        run: |
          node tests/asset-library.test.cjs 2>&1 | Tee-Object -FilePath .ci-results/library.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Testar backup e restauração da biblioteca
        run: |
          node tests/library-backup.test.cjs 2>&1 | Tee-Object -FilePath .ci-results/library-backup.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Garantir preservação do Creator original e dos módulos
        run: |
          $required = @(
            "APOENA_GAME_CREATOR_V4_0_BANCADA_INTEGRADA.html",
            "pixel-art/index.html",
            "pixel-art/estudio.html",
            "map-editor/index.html",
            "integracao/index.html",
            "legacy/iniciador-anterior.html"
          )
          foreach ($path in $required) {
            if (-not (Test-Path $path)) { throw "Arquivo essencial ausente: $path" }
          }
          $index = Get-Content -Raw index.html
          if ($index -notmatch 'data-page="3d"') { throw "A navegação 3D não foi encontrada no Creator." }
          if ($index -notmatch 'data-page="pixel"') { throw "A navegação Pixel Art não foi encontrada no Creator." }
          $map = Get-Content -Raw map-editor/index.html
          if ($map -notmatch 'asset-library.js') { throw "O editor de mapas não carrega a biblioteca central." }
          "Contratos de preservação e integração passaram." | Tee-Object -FilePath .ci-results/contracts.log
      - name: Anexar logs de diagnóstico
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v41-ci-diagnostics
          path: .ci-results/
          if-no-files-found: warn
